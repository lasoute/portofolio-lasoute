<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Video Manager | Lasoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; overflow-x: hidden; }
        .neon-pink { text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; }
        .bg-grid { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; }
        
        @keyframes slideIn { 0% { opacity: 0; transform: translateX(-20px); } 100% { opacity: 1; transform: translateX(0); } }
        .animate-slide-in { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen font-sans bg-grid relative selection:bg-cyan-500 selection:text-white">
    <!-- Glow central -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-pink-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative z-10 max-w-6xl mx-auto p-6 sm:p-12 space-y-10 animate-fade-up">
        
        <!-- Cabecera -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-4xl sm:text-5xl font-black neon-pink uppercase tracking-tight">🎬 M.V. Manager</h1>
                <p class="text-slate-400 mt-2 font-mono">Workspace Local // Videoclips en curso</p>
            </div>
            <a href="index.html" class="group flex items-center px-4 py-2 bg-slate-900 border border-slate-700 hover:border-cyan-500 rounded-lg text-slate-300 hover:text-cyan-400 transition-all duration-300">
                <span class="mr-2 transform group-hover:-translate-x-1 transition-transform">&lt;-</span> Portfolio
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Panel Izquierdo: Formulario -->
            <div class="lg:col-span-4 h-fit p-6 sm:p-8 rounded-2xl bg-slate-900/60 backdrop-blur-xl border border-slate-800 shadow-2xl">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
                    <h2 class="text-xl font-bold text-white tracking-wide">Añadir Proyecto</h2>
                </div>
                <form id="project-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-xs font-mono text-slate-400 uppercase tracking-wider">Artista</label>
                        <input type="text" id="artist" placeholder="ej. JR VARGAS" required class="w-full bg-slate-950/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-mono text-slate-400 uppercase tracking-wider">Canción / Track</label>
                        <input type="text" id="track" placeholder="ej. Nombre del tema" required class="w-full bg-slate-950/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-mono text-slate-400 uppercase tracking-wider">Estado de Edición</label>
                        <select id="status" class="w-full bg-slate-950/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all appearance-none cursor-pointer">
                            <option value="Bruto">1. Material en Bruto</option>
                            <option value="Cortes">2. Sincronización y Cortes</option>
                            <option value="FX">3. Efectos (After Effects)</option>
                            <option value="Color">4. Color Grading</option>
                            <option value="Render">5. Render Final</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(236,72,153,0.3)] hover:shadow-[0_0_25px_rgba(236,72,153,0.5)] transform hover:-translate-y-0.5">
                        + Añadir al Workflow
                    </button>
                </form>
            </div>

            <!-- Panel Derecho: Lista Dinámica -->
            <div class="lg:col-span-8">
                <div id="project-list" class="space-y-4">
                    <!-- Los proyectos aparecerán aquí por JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de la App -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('project-form');
            const list = document.getElementById('project-list');
            
            // Carga de la memoria local
            let projects = JSON.parse(localStorage.getItem('mvm_projects')) || [];

            function saveProjects() {
                localStorage.setItem('mvm_projects', JSON.stringify(projects));
            }

            function getStatusBadge(status) {
                const styles = {
                    'Bruto': 'bg-slate-500/10 text-slate-400 border-slate-500/20',
                    'Cortes': 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20',
                    'FX': 'bg-purple-500/10 text-purple-400 border-purple-500/20',
                    'Color': 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20',
                    'Render': 'bg-green-500/10 text-green-400 border-green-500/20'
                };
                const cls = styles[status] || styles['Bruto'];
                return `<span class="px-3 py-1 text-xs font-mono rounded-full border ${cls} flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-current"></div>${status}</span>`;
            }

            function renderProjects() {
                list.innerHTML = '';
                if(projects.length === 0) {
                    list.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 border border-dashed border-slate-700 rounded-2xl bg-slate-900/30">
                            <span class="text-4xl mb-3 opacity-50">📂</span>
                            <p class="text-slate-500 font-mono text-sm">No hay videoclips en cola.</p>
                        </div>`;
                    return;
                }

                projects.forEach((proj, index) => {
                    const card = document.createElement('div');
                    // Animación progresiva al cargar la lista
                    card.style.animationDelay = `${index * 0.1}s`;
                    card.className = 'animate-slide-in opacity-0 p-5 sm:p-6 border border-slate-800 rounded-2xl bg-slate-900/40 backdrop-blur-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-slate-600 transition-colors group relative overflow-hidden';
                    
                    card.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-pink-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="pl-2">
                            <h3 class="text-2xl font-black text-white tracking-tight mb-2">${proj.artist}</h3>
                            <div class="flex items-center gap-3">
                                <span class="text-slate-400 text-sm font-mono">#${proj.track}</span>
                                ${getStatusBadge(proj.status)}
                            </div>
                        </div>
                        <button onclick="deleteProject(${index})" class="w-full sm:w-auto mt-4 sm:mt-0 px-4 py-2 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all duration-300 text-sm font-bold flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Eliminar
                        </button>
                    `;
                    list.appendChild(card);
                });
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const artist = document.getElementById('artist').value;
                const track = document.getElementById('track').value;
                const status = document.getElementById('status').value;

                // Añadimos al principio del array (unshift) en lugar de al final (push)
                projects.unshift({ artist, track, status, date: new Date().toISOString() });
                saveProjects();
                renderProjects();
                form.reset();
                document.getElementById('artist').focus();
            });

            window.deleteProject = (index) => {
                projects.splice(index, 1);
                saveProjects();
                renderProjects();
            };

            renderProjects();
        });
    </script>
</body>
