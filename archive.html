<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo | Lasoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #02040a; color: #f5f5f7; overflow-x: hidden; }
        
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: float 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        .delay-2000 { animation-delay: 2s; }

        .glass-nav { background: rgba(2, 4, 10, 0.5); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

    <div class="fixed inset-0 w-full h-full overflow-hidden z-[-1] bg-[#02040a]">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-blue-900/30 rounded-full blur-[120px] animate-blob"></div>
        <div class="absolute top-[30%] right-[-10%] w-[40vw] h-[40vw] bg-indigo-900/20 rounded-full blur-[120px] animate-blob delay-2000"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 text-xs font-medium tracking-widest uppercase text-gray-400">
                <a href="index.html" class="text-white text-sm font-bold tracking-tight hover:opacity-70 transition-opacity">Lasoute.</a>
                
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="hover:text-blue-300 transition-colors hidden sm:flex items-center gap-2">
                        &lt;- Volver a inicio
                    </a>
                    
                    <!-- Iconos Redes Sociales Arriba -->
                    <div class="flex items-center space-x-5 sm:border-l border-white/10 sm:pl-6">
                        <a href="https://www.instagram.com/lasoutee/" target="_blank" class="hover:text-white transition-colors" title="Instagram">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                        </a>
                        <a href="https://www.youtube.com/@lasoute" target="_blank" class="hover:text-white transition-colors" title="YouTube">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-6 lg:px-8 max-w-7xl mx-auto min-h-screen">
        <div class="fade-up mb-16 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6">
            <div>
                <h1 id="archive-title" class="text-5xl sm:text-7xl font-black tracking-tighter">Archivo.</h1>
                <p id="archive-subtitle" class="text-gray-400 mt-4 text-lg font-light">Cargando proyectos...</p>
            </div>
            <a id="youtube-link" href="#" target="_blank" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-6 py-3 rounded-full font-medium text-sm transition-colors border border-blue-500/30 flex items-center gap-2">
                Abrir canal en YouTube ↗
            </a>
        </div>

        <div id="archive-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Se inyectarán aquí -->
        </div>
        
        <div class="mt-16 text-center fade-up" style="animation-delay: 1s;">
            <p class="text-gray-500 text-sm font-light mb-4">¿No encuentras vídeos más antiguos?</p>
            <a id="youtube-bottom-link" href="#" target="_blank" class="inline-block glass-panel px-8 py-4 rounded-full hover:bg-white/10 transition-colors text-white text-sm font-medium">
                Ver historial completo en YouTube
            </a>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'videoclips'; 
        
        const PLAYLIST_ID = 'PL_yJYjCz-KcmsU_FVl_yBYHchIk9JmOgz'; 
        const CHANNEL_ID = 'UCNe_yvKMwhOKsx1uwbsooMw'; 

        const titleEl = document.getElementById('archive-title');
        const subtitleEl = document.getElementById('archive-subtitle');
        const ytLink = document.getElementById('youtube-link');
        const ytLinkBottom = document.getElementById('youtube-bottom-link');

        let targetUrl = '';
        let badge = '';

        if (type === 'youtube') {
            titleEl.textContent = 'Canal de YouTube.';
            subtitleEl.textContent = 'Últimos vídeos y directos del canal.';
            targetUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            badge = 'Directo / Vídeo';
            
            const channelUrl = `https://www.youtube.com/channel/${CHANNEL_ID}`;
            ytLink.href = channelUrl;
            ytLinkBottom.href = channelUrl;
        } else {
            titleEl.textContent = 'Videoclips.';
            subtitleEl.textContent = 'Últimos 15 proyectos del portfolio.';
            targetUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;
            badge = 'Videoclip';
            
            const playlistUrl = `https://www.youtube.com/playlist?list=${PLAYLIST_ID}`;
            ytLink.href = playlistUrl;
            ytLinkBottom.href = playlistUrl;
            ytLink.textContent = 'Abrir Playlist en YouTube ↗';
        }

        async function loadAllVideos() {
            const container = document.getElementById('archive-container');
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = ''; 
                    
                    data.items.forEach((video, index) => {
                        const videoId = video.link.split('v=')[1];
                        
                        const cardHtml = `
                            <a href="${video.link}" target="_blank" class="fade-up group glass-panel relative rounded-3xl overflow-hidden transition-all duration-500 hover:-translate-y-2 block" style="animation-delay: ${index * 0.05}s">
                                <div class="aspect-video w-full relative overflow-hidden">
                                    <img src="https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onerror="this.src='https://i.ytimg.com/vi/${videoId}/hqdefault.jpg'">
                                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <span class="bg-white/20 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-medium border border-white/30">Ver en YouTube ↗</span>
                                    </div>
                                </div>
                                <div class="p-6">
                                    <h3 class="text-xl font-semibold tracking-tight truncate group-hover:text-blue-300 text-gray-200 transition-colors">${video.title}</h3>
                                    <p class="text-sm text-gray-500 mt-1">${badge}</p>
                                </div>
                            </a>
                        `;
                        container.innerHTML += cardHtml;
                    });
                }
            } catch (error) {
                container.innerHTML = `<div class="col-span-full text-red-400 py-8">Error al cargar los proyectos.</div>`;
            }
        }

        loadAllVideos();
    </script>
</body>
</html>
