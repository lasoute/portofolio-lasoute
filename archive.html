<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo | Lasoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #f5f5f7; }
        
        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
            z-index: 9999; opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass-nav { background: rgba(5, 5, 5, 0.5); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">
    <div class="noise-bg"></div>

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 text-xs font-medium tracking-widest uppercase text-gray-400">
                <a href="index.html" class="text-white text-sm font-bold tracking-tight hover:opacity-70 transition-opacity">Lasoute.</a>
                <a href="index.html" class="hover:text-white transition-colors flex items-center gap-2">
                    &lt;- Volver
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-6 lg:px-8 max-w-7xl mx-auto min-h-screen">
        <div class="fade-up mb-16">
            <h1 id="archive-title" class="text-5xl sm:text-7xl font-black tracking-tighter">Archivo.</h1>
            <p id="archive-subtitle" class="text-gray-400 mt-4 text-lg font-light">Cargando proyectos...</p>
        </div>

        <div id="archive-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Los vídeos se inyectarán aquí -->
        </div>
    </main>

    <script>
        // Leer si el usuario pidió videoclips o beats en la URL
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'videoclips'; // por defecto videoclips
        
        const PLAYLIST_ID = 'PL_yJYjCz-KcmsU_FVl_yBYHchIk9JmOgz'; 
        const CHANNEL_ID = 'UCNe_yvKMwhOKsx1uwbsooMw'; 

        const titleEl = document.getElementById('archive-title');
        const subtitleEl = document.getElementById('archive-subtitle');

        let targetUrl = '';
        let badge = '';

        if (type === 'beats') {
            titleEl.textContent = 'Todos los Beats.';
            subtitleEl.textContent = 'Instrumentales y producciones.';
            targetUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            badge = 'Instrumental';
        } else {
            titleEl.textContent = 'Videoclips.';
            subtitleEl.textContent = 'Archivo completo de ediciones.';
            targetUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;
            badge = 'Videoclip';
        }

        async function loadAllVideos() {
            const container = document.getElementById('archive-container');
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = ''; 
                    
                    data.items.forEach((video, index) => {
                        const videoId = video.link.split('v=')[1];
                        // Añadimos delay escalonado a cada tarjeta
                        const cardHtml = `
                            <div class="fade-up group relative rounded-3xl overflow-hidden bg-[#0a0a0a] transition-all duration-700 hover:-translate-y-2 border border-white/5 hover:border-white/20" style="animation-delay: ${index * 0.1}s">
                                <div class="aspect-video w-full">
                                    <iframe class="w-full h-full pointer-events-auto" src="https://www.youtube.com/embed/${videoId}?controls=1&rel=0" title="${video.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                </div>
                                <div class="p-6">
                                    <h3 class="text-xl font-semibold tracking-tight truncate group-hover:text-white text-gray-200 transition-colors">${video.title}</h3>
                                    <p class="text-sm text-gray-500 mt-1">${badge}</p>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHtml;
                    });
                }
            } catch (error) {
                container.innerHTML = `<div class="col-span-full text-red-400 py-8">Error al cargar los proyectos.</div>`;
            }
        }

        loadAllVideos();
    </script>
</body>
</html>
