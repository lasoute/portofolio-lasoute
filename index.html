<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasoute | Video & Beats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #000000; 
            color: #f5f5f7; 
        }
        
        @keyframes reveal {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal {
            animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .glass-nav {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">

    <!-- Navegación -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="relative z-50 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 text-xs font-medium tracking-wide text-gray-300">
                <a href="#" class="text-white text-lg font-semibold tracking-tight hover:opacity-70 transition-opacity">Lasoute.</a>
                
                <div class="hidden sm:flex space-x-8">
                    <a href="#work" class="hover:text-white transition-colors">Videoclips</a>
                    <a href="#beats" class="hover:text-white transition-colors">Beats</a>
                    <a href="#contact" class="hover:text-white transition-colors">Contacto</a>
                </div>
                
                <div class="sm:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-white p-2 focus:outline-none hover:opacity-70 transition-opacity">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Menú Móvil Desplegable -->
        <div id="mobile-menu" class="fixed inset-0 h-screen w-screen bg-black/90 backdrop-blur-xl z-40 opacity-0 pointer-events-none transition-opacity duration-300
